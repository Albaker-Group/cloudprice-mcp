name: Security checks

# Runs on every PR and on pushes to main. All tooling here is open source and
# free on private repositories - GitHub's own secret scanning and CodeQL are
# paid for private repos (GitHub Secret Protection / Code Security), so these
# are the equivalents that cost nothing.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. Individual jobs raise this only if they must.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a full commit SHA, not a tag. A tag is
      # mutable: in March 2026 attackers force-pushed 75 of 76 trivy-action
      # tags and exfiltrated secrets from every pipeline that used one.
      # Dependabot keeps these SHAs current - see .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave GITHUB_TOKEN in .git/config; it can leak
          # through uploaded artifacts (zizmor: artipacked).
          persist-credentials: false
          # Full history so gitleaks can scan past commits, not just the tip.
          fetch-depth: 0

      # The gitleaks binary rather than gitleaks-action: the action requires a
      # paid licence for organisations, the binary does not.
      # Pinned version AND verified checksum. Pulling a tool into CI without
      # verifying it is the same class of problem as an unpinned action -
      # zizmor flags it as adhoc-packages. The hash is from the project's
      # published checksums.txt for this exact release.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan repository history
        run: gitleaks detect --source . --redact --verbose --no-banner

  actions-lint:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave GITHUB_TOKEN in .git/config; it can leak
          # through uploaded artifacts (zizmor: artipacked).
          persist-credentials: false

      # zizmor is static analysis for the workflows themselves: template
      # injection, credential leaks, over-broad permissions, unpinned actions.
      # The CI config is part of the attack surface, not just the app.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Uploads SARIF to GitHub code scanning, which is what puts findings
          # inline on the diff instead of leaving them as run annotations.
          # Free on public repositories; private repos need the paid Code
          # Security product, so this stays false there.
          advanced-security: true
          persona: regular
          # Fail the build on medium and above; report low/help findings
          # without blocking. The remaining low-severity items are inline
          # `pip install` calls in the existing cloud deploy workflows -
          # real, worth pinning eventually, but not worth blocking every PR
          # on while they are the lowest severity zizmor reports.
          min-severity: medium

  iac:
    name: Infrastructure scan (Checkov + Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave GITHUB_TOKEN in .git/config; it can leak
          # through uploaded artifacts (zizmor: artipacked).
          persist-credentials: false

      # Checkov is run from pip rather than its action. The action's inputs
      # change between versions - output_file_path is silently ignored on the
      # pinned release, so the SARIF file was never written and the upload step
      # then failed on a missing path. A pinned pip install has one contract.
      - name: Checkov
        run: |
          set -euo pipefail
          pip install --quiet "checkov==3.3.16"
          # Findings are advisory (--soft-fail): they surface as code scanning
          # alerts, and Trivy and gitleaks decide pass or fail.
          #
          # SARIF only, then renamed. From 2026-09-06 to 2026-11-04 this ran
          # `--output cli --output sarif --output-file-path console,.`, which
          # crashes (checkov opens "." as a file) - and a trailing `|| true`
          # swallowed the crash, so no report was uploaded for two months and
          # the code scanning alerts froze. No `|| true` now: --soft-fail
          # already returns 0 for findings, so only a real crash fails.
          checkov --directory . --framework terraform --output sarif --output-file-path . --soft-fail --quiet
          mv results_sarif.sarif results.sarif
          # Drop results suppressed in source (#checkov:skip with a reason) before
          # upload: GitHub ignores SARIF `suppressions` and opens them as alerts.
          # The decision and its reason stay next to the resource in infra/.
          python3 - <<'PY'
          import json
          doc = json.load(open("results.sarif"))
          run = doc["runs"][0]
          kept = [r for r in run["results"] if not r.get("suppressions")]
          print(f"Checkov: {len(kept)} open, {len(run['results']) - len(kept)} skipped with a recorded reason")
          run["results"] = kept
          json.dump(doc, open("results.sarif", "w"))
          PY

      # tfsec is deprecated - its engine now lives in Trivy, so `trivy config`
      # is the current way to get that ruleset.
      # Install Trivy ourselves: a pinned release checked against a SHA-256 held
      # here, not fetched alongside it. The action's own setup runs
      # contrib/install.sh from Trivy's *unpinned main branch*. That broke on
      # 2026-11-03 (exit 6 after upstream commit 75c4dc0) and failed every scan,
      # and it is unreviewed third-party code in CI either way.
      # To upgrade: change both values; the hash is in the release's checksums.txt.
      - name: Install Trivy (pinned, checksum-verified)
        env:
          TRIVY_VERSION: "0.76.1"
          TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "/tmp/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "${TRIVY_SHA256}  /tmp/$tarball" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "/tmp/$tarball" -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Publish Checkov findings to code scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: checkov
