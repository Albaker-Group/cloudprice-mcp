name: Container image (ARM64)

# Builds the HTTP-transport image and pushes it to GitHub Container Registry.
#
# WHY ghcr.io AND NOT AZURE CONTAINER REGISTRY
#   ACR Basic is ~$5/month. This image is a few hundred MB of a public,
#   open-source project, and ghcr.io hosts public images for nothing. $5/month
#   is half the entire budget for the cluster this runs on.
#
# WHY A NATIVE ARM RUNNER AND NOT QEMU
#   The AKS node is aarch64. Cross-building arm64 on an amd64 runner under QEMU
#   works but is several times slower and has a habit of failing oddly inside
#   native wheels. ubuntu-24.04-arm is free for public repositories, so there is
#   no reason to emulate.

on:
  push:
    branches: [main]
    paths:
      - "http_api/**"
      - "helm/**"
      - "src/cloudprice_mcp/**"
      - "pyproject.toml"
      - ".github/workflows/container.yml"
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # Required to sign the provenance attestation. id-token is the OIDC token used
  # to prove to Sigstore that this really is this workflow in this repo.
  id-token: write
  attestations: write

jobs:
  build:
    name: Build + push arm64
    runs-on: ubuntu-24.04-arm
    steps:
      # SHA-pinned: the repo's zizmor policy rejects tag references, because a
      # tag can be moved to point at different code after review.
      # persist-credentials: false stops the job's token being left in
      # .git/config, where any later step - or an uploaded artifact - can read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from pyproject
        id: ver
        run: |
          v=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          [ -n "$v" ] || { echo "could not read version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # ghcr.io rejects uppercase in a repository name, and
          # github.repository is "Albaker-Group/cloudprice-mcp". Without this
          # the push fails after a full build with an "invalid reference
          # format" error that never mentions capital letters.
          repo_lc=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo_lc}/http" >> "$GITHUB_OUTPUT"
          echo "Version: $v  Image: ghcr.io/${repo_lc}/http"

      # Emulation, so this arm64 runner can also produce the amd64 half of the
      # manifest. Needed because the image has to run in two places with
      # different CPUs - see the platforms list below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Required for cache-from/cache-to. The default "docker" driver cannot
      # export a cache and fails with "Cache export is not supported for the
      # docker driver" only once the build command actually runs.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: http_api/Dockerfile
          # BOTH architectures, in one manifest index.
          #
          # arm64 alone was not enough, and the failure is worth recording: the
          # AKS node is Standard_B2pls_v2 (arm64, chosen because it is ~20%
          # cheaper), but Azure Container Apps runs amd64 ONLY. Deploying the
          # arm64-only image there failed with
          #
          #   no child with platform linux/amd64 in index
          #
          # which is accurate and mentions neither Container Apps nor the fact
          # that the image was single-arch. One index carrying both means the
          # same digest works in both places, and each runtime picks its own.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain metadata, both free:
          #   provenance - a signed record of WHAT built this and from which commit
          #   sbom       - the list of packages inside, so a future CVE can be
          #                answered with "is it in our image" instead of a guess
          provenance: mode=max
          sbom: true

      # Prove the image runs BEFORE it is deployed anywhere. A container that
      # starts and then fails every request - the classic symptom of package
      # data that did not make it into the image - passes a plain `docker run`
      # but fails this.
      - name: Smoke-test the pushed image
        env:
          IMAGE: ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE"

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "--- /readyz (loads the price catalogue) ---"
          curl -fsS http://localhost:8080/readyz | tee /tmp/ready.json
          echo
          # readyz returns 503 with an error body if the catalogue is missing,
          # so -f alone is the real assertion here.

          echo "--- /tools ---"
          count=$(curl -fsS http://localhost:8080/tools | python3 -c 'import sys,json;print(json.load(sys.stdin)["count"])')
          echo "tools: $count"
          [ "$count" -ge 20 ] || { echo "FAIL: expected 20+ tools, got $count"; docker logs smoke; exit 1; }

          echo "--- a real priced call ---"
          curl -fsS -X POST http://localhost:8080/call \
            -H 'Content-Type: application/json' \
            -d '{"tool":"get_aws_price","arguments":{"instance_type":"t3.2xlarge"}}' \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d.get("hourly_usd") or d.get("monthly_usd"),d;print("priced ok:",d.get("sku"),d.get("as_of"))'

          echo "--- architectures in the manifest ---"
          # docker run can only execute the runner's own architecture, so the
          # real assertion is on the INDEX: both platforms must be present, or
          # one of the two deployment targets silently cannot pull it.
          docker buildx imagetools inspect "$IMAGE" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}}{{println}}{{end}}'             | grep -v '^$' | grep -v unknown | sort -u | tee /tmp/arches.txt
          grep -q '^linux/amd64$' /tmp/arches.txt || { echo "FAIL: no linux/amd64 - Container Apps cannot run this"; exit 1; }
          grep -q '^linux/arm64$' /tmp/arches.txt || { echo "FAIL: no linux/arm64 - the AKS node cannot run this"; exit 1; }
          echo "both platforms present"

          docker rm -f smoke >/dev/null

      # A signed, verifiable statement that this exact image digest was built by
      # this workflow, from this commit. Without it, nothing distinguishes the
      # image CI pushed from one someone with packages:write pushed by hand -
      # the cluster would pull either without complaint.
      #
      # Verify with:
      #   gh attestation verify oci://<image>@<digest> --repo Albaker-Group/cloudprice-mcp
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ver.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Scan the IMAGE, not the IaC. The existing Trivy job scans Terraform and
      # Dockerfiles; nothing until now looked at what is actually installed
      # inside the built container - the Python base image and every wheel in
      # the venv. exit-code 1 means a HIGH or CRITICAL fails the build rather
      # than producing a report nobody opens.
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Publish the chart as an OCI artifact alongside the image.
      #
      # Terraform in terraform-azure-aks deploys this with helm_release and
      # points at oci://.../charts/cloudprice. The alternative - a relative path
      # into a sibling checkout - resolves on Ali's laptop and nowhere else,
      # which is not a deployment mechanism. Versioned OCI keeps the two repos
      # decoupled and makes a rollback a version number.
      - name: Package and push the Helm chart
        # Values come through env, NOT inline ${{ }} inside run.
        #
        # zizmor flags the inline form as template-injection, and it is right in
        # principle: the expression is substituted into the script text before
        # the shell sees it, so anything attacker-influenced - github.actor on a
        # fork PR being the classic - becomes code rather than data. Passed as
        # env vars they are values the shell quotes, and can never be code.
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CHART_REPO=$(echo "oci://ghcr.io/${GITHUB_REPOSITORY}/charts" | tr '[:upper:]' '[:lower:]')

          # Keep the chart's appVersion honest: it should name the image tag
          # this run actually built, not whatever happens to be committed.
          helm package helm/cloudprice             --app-version "${APP_VERSION}"             --destination /tmp/chart

          helm registry login ghcr.io             --username "${GHCR_USER}"             --password-stdin <<<"${GHCR_TOKEN}"

          CHART_VER=$(grep -m1 '^version:' helm/cloudprice/Chart.yaml | awk '{print $2}')
          helm push "/tmp/chart/cloudprice-${CHART_VER}.tgz" "${CHART_REPO}"
          echo "Pushed ${CHART_REPO}/cloudprice:${CHART_VER} (appVersion ${APP_VERSION})"
