name: Release to PyPI

# Triggered by pushing a version tag (e.g., `git tag v0.7.0 && git push --tags`).
# Uses PyPI Trusted Publishing (OIDC) -- NO API TOKEN.
#
# One-time setup (per project, by repo owner):
#   1. PyPI -> Account settings -> Publishing -> Add a new pending publisher
#   2. Project name: cloudprice-mcp
#   3. Owner: Albaker-Group
#   4. Repository: cloudprice-mcp
#   5. Workflow name: release.yml
#   6. Environment name: pypi
# After the first successful publish, PyPI flips the pending publisher to active.
# After that, every tag push publishes automatically -- no token to rotate, ever.

on:
  push:
    tags:
      - "v*"

# Least privilege at the workflow level; the one job that needs id-token
# raises it for itself. Granting id-token: write to every job hands the build
# job an OIDC identity it never uses (zizmor: excessive-permissions).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing OIDC — this job only
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cloudprice-mcp/
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
