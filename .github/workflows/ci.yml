name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The weekly price refresh dispatches this on its own branch: GitHub holds
  # pull_request runs on bot-opened PRs for manual approval, so they never ran.
  workflow_dispatch:

# CI runs zero-trust: no AWS, no PyPI, just tests + lint. Safe to allow on PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave GITHUB_TOKEN in .git/config; it can leak
          # through uploaded artifacts (zizmor: artipacked).
          persist-credentials: false
      # uv installs the exact versions in uv.lock; --frozen fails instead of
      # silently re-resolving if pyproject.toml and the lockfile disagree.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.4" # same as mise.toml
          python-version: ${{ matrix.python-version }}
          # No cache: a poisoned cache entry would reach every later run
          # (zizmor: cache-poisoning). The install takes seconds without one.
          enable-cache: false
      - run: uv sync --frozen
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      # The coverage floor lives in pyproject.toml ([tool.coverage.report]).
      - name: Run tests (with coverage floor)
        run: uv run pytest -q --cov --cov-report=term
