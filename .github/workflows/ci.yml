name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI runs zero-trust: no AWS, no PyPI, just tests + lint. Safe to allow on PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave GITHUB_TOKEN in .git/config; it can leak
          # through uploaded artifacts (zizmor: artipacked).
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Lint with ruff
        run: ruff check src tests
